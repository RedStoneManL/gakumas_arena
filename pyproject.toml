[project]
name = "gakumas-arena"
version = "0.1.0"
description = "Local, configurable, RL-ready sandbox of Gakuen Idolmaster produce mode (facade over the vendored gakumas_rl engine)"
requires-python = ">=3.11"
# gakumas_rl is GPL-3.0 (third_party/gakumas_rl_upstream/LICENSE); the combined distribution inherits it.
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "orjson>=3.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# mirrors upstream gakumas_rl extras: SB3 MaskablePPO training backend / torch models
sb3 = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.2"]
torch = ["torch>=2.2"]
rllib = ["ray[rllib]>=2.9", "torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]
scrape = ["httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5", "playwright>=1.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gakumas_arena*", "gakumas_rl*"]

[tool.setuptools.package-data]
gakumas_arena = ["scenarios/*.yaml"]
gakumas_rl = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["gakumas_rl", "tests/gakumas_rl"]
